name: Offline source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.:tests'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python source syntax
        run: |
          python - <<'PYCODE'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          PYCODE
      - name: Browser regression tests
        run: node --test tests/test_*.cjs
      - name: Install geometry dependency
        run: python -m pip install numpy==2.2.6
      - name: Synthetic geometry and state tests (no robot)
        run: >-
          python -m unittest -v
          test_exploration_frontiers
          test_navigation_planning_v3
          test_local_trajectory
          test_map_change_policy
          test_pose_monitor
          test_latest_observation
          test_start_pose_recovery
