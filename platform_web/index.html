<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>M20 Pro · 机器人操作平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1f27'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='700' fill='%236be2bd' text-anchor='middle'%3EM20%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css?v=2.8ui2">
  <link rel="stylesheet" href="/map_library.css?v=1">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview" aria-label="M20 Pro 工作台">
      <span class="brand-mark">M<span>20</span></span>
      <span class="brand-text"><strong>LYNX</strong><small>M20 PRO CONSOLE</small></span>
    </a>
    <div class="sidebar-device" aria-live="polite">
      <span class="device-dot" id="sidebar-dot"></span>
      <div class="sidebar-device-copy"><strong>M20 Pro</strong><small id="sidebar-mode">本地演示设备</small></div>
      <button class="icon-button sidebar-settings" data-page="settings" aria-label="连接设置">⚙</button>
    </div>
    <nav id="navigation" class="navigation" aria-label="主要功能"></nav>
    <div class="sidebar-foot">
      <span class="sidebar-version"><span class="dot"></span> 操作平台 v2.7.1</span>
      <a href="/docs" target="_blank" rel="noopener">API 文档</a>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="breadcrumbs"><span>机器人工作空间</span><span class="crumb-sep">/</span><strong id="breadcrumb">工作台</strong></div>
      <div class="topbar-right">
        <span id="connection-pill" class="pill">演示模式</span>
        <span id="live-clock" class="mono clock"></span>
        <button class="btn danger small topbar-stop" data-action="estop" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>软急停</button>
        <button class="avatar" data-page="settings" aria-label="打开连接中心">OP</button>
      </div>
    </header>
    <main id="main"></main>
    <footer class="statusbar">
      <span id="footer-connection"><span class="dot"></span> 本地演示环境</span>
      <span class="statusbar-units">坐标 / m · 关节 / rad · 轮速 / rad/s</span>
      <span class="statusbar-keys">空格停止 <kbd>SPACE</kbd><button class="stop-fixed" data-action="estop">软急停</button></span>
    </footer>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="/vendor/viewer.js?v=2.8ui1"></script>
  <script src="/app.js?v=3.1-pose" defer></script>
  <script src="/hub.js?v=2.8asyncfix1" defer></script>
  <script src="/connections.js?v=2.8ui1" defer></script>
  <script src="/sharing.js?v=2.8ui1" defer></script>
  <script src="/workspace.js?v=2.8video-sync1" defer></script>
  <script src="/pose_display.js?v=1" defer></script>
  <script src="/navigation_status.js?v=3.0-planning1" defer></script>
  <script src="/workflows.js?v=3.3-map-library" defer></script>
  <script src="/autonomy.js?v=3.0-planning1" defer></script>
  <script src="/vision_models.js?v=2.8ui2" defer></script>
  <script src="/map_learning.js?v=3.3-map-library" defer></script>
  <script src="/map_library.js?v=2" defer></script>
  <script src="/people_counting.js?v=2.8ui2" defer></script>
</body>
</html>
