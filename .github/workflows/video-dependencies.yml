name: Video runtime installation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    name: Bundled FFmpeg and OpenCV / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video wheels and decode the synthetic HEVC fixture
        if: runner.os != 'Windows'
        run: |
          python -m pip install --only-binary=:all: -r requirements-video.txt
          python tools/check_video.py --bundled
      - name: Validate the Windows video-only installer
        if: runner.os == 'Windows'
        run: python windows/setup.py --video-only
