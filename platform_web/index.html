<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>具身智能机器狗 · 机器人操作平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1f27'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='700' fill='%236be2bd' text-anchor='middle'%3EM20%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css?v=3.12">
  <link rel="stylesheet" href="/map_library.css?v=2">
</head>
<body>
  <aside class="rail" id="rail" aria-label="模块导航">
    <a class="rail-brand" href="#overview" aria-label="具身智能机器狗 工作台">
      <img src="/brand-logo.svg?v=1" alt="中铁" width="30" height="25">
    </a>
    <div class="rail-device" title="设备连接状态">
      <span class="device-dot" id="sidebar-dot"></span>
      <small id="sidebar-mode">演示</small>
    </div>
    <nav id="rail-nav" class="rail-nav"></nav>
    <div class="rail-foot">
      <a href="/docs" target="_blank" rel="noopener" title="API 文档">API</a>
      <span class="rail-version" title="机器人操作平台">v3</span>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="breadcrumbs"><span id="crumb-module">作业台</span><span class="crumb-sep">/</span><strong id="breadcrumb">工作台</strong></div>
      <div class="topbar-right">
        <span id="connection-pill" class="pill">演示模式</span>
        <span id="live-clock" class="mono clock"></span>
        <div class="voice-control">
          <button class="btn ghost small" id="voice-toggle" type="button" aria-pressed="false" title="语音控制：说“起立”或“趴下”"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zM17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>语音</button>
          <span id="voice-status" class="voice-status" role="status" aria-live="polite" hidden></span>
        </div>
        <button class="btn danger small topbar-stop" data-action="estop" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>软急停</button>
        <button class="avatar" data-page="settings" aria-label="打开连接中心">OP</button>
      </div>
    </header>
    <div class="module-bar">
      <nav id="module-tabs" class="module-tabs" role="tablist" aria-label="当前模块页面"></nav>
    </div>
    <main id="main"></main>
    <footer class="statusbar">
      <span id="footer-connection"><span class="dot"></span> 本地演示环境</span>
      <span class="statusbar-units">坐标 / m · 关节 / rad · 轮速 / rad/s</span>
      <span class="statusbar-keys">WASD 移动 · 空格停止 <kbd>SPACE</kbd><button class="stop-fixed" data-action="estop">软急停</button></span>
    </footer>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="/vendor/viewer.js?v=3.10"></script>
  <script src="/app.js?v=3.12" defer></script>
  <script src="/hub.js?v=3.9-gos-ui" defer></script>
  <script src="/connections.js?v=3.10" defer></script>
  <script src="/sharing.js?v=2.8ui1" defer></script>
  <script src="/workspace.js?v=3.13" defer></script>
  <script src="/pose_display.js?v=1" defer></script>
  <script src="/navigation_status.js?v=3.0-planning1" defer></script>
  <script src="/iot.js?v=3" defer></script>
  <script src="/workflows.js?v=3.12" defer></script>
  <script src="/autonomy.js?v=3.6-ia" defer></script>
  <script src="/vision_models.js?v=2.8ui2" defer></script>
  <script src="/map_learning.js?v=3.6-patrol" defer></script>
  <script src="/map_library.js?v=2" defer></script>
  <script src="/people_counting.js?v=2.8ui2" defer></script>
  <script src="/goal_approach.js?v=1" defer></script>
  <script src="/navigation_preparation.js?v=6" defer></script>
  <script src="/disconnect_policy.js?v=4" defer></script>
  <script src="/voice_control.js?v=1" defer></script>
</body>
</html>
